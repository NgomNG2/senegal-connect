name: CI/CD Pipeline - Sénégal Connect

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # JOB 1 : Tests & Qualité de Code
  # ==========================================
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Configuration de Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Lancement des tests et de la couverture
        run: npm run test:cov -- --ci
        env:
          JWT_SECRET: ci-test-secret
          JWT_ISSUER: senegal-connect

      - name: Archivage du rapport de couverture
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

  # ==========================================
  # JOB 2 : Build & Push de l'image Docker
  # ==========================================
  build-and-push:
    needs: test # Ne s'exécute QUE si les tests passent avec succès
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # Nécessaire pour pousser sur GitHub Packages (GHCR)

    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      # Configuration de Docker Buildx (indispensable pour les builds optimisés)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Une PR valide le build sans publier d'image.
      - name: Connexion au registre GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extraction des métadonnées (tags, labels) pour l'image Docker
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      # Build et Push effectifs de l'image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }} # On ne pousse pas sur le registre lors d'une simple PR, on teste juste le build
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max